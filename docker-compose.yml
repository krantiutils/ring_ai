services:
  # --- Database ---
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ring_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ring_ai}
      POSTGRES_DB: ${POSTGRES_DB:-ring_ai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ring_ai}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Message Broker ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Backend API ---
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ring_ai}:${POSTGRES_PASSWORD:-ring_ai}@postgres:5432/${POSTGRES_DB:-ring_ai}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend/piper-models:/opt/piper-models:ro
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      # API + health routes (higher priority)
      - "traefik.http.routers.ringai-api.rule=Host(`agentshakti.xyz`) && (PathPrefix(`/api`) || PathPrefix(`/health`))"
      - "traefik.http.routers.ringai-api.entrypoints=websecure"
      - "traefik.http.routers.ringai-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ringai-api.priority=2"
      - "traefik.http.services.ringai-api.loadbalancer.server.port=8000"

  # --- Background Worker ---
  celery-worker:
    build: ./backend
    restart: unless-stopped
    command: uv run celery -A app.core.celery_app worker -l info --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ring_ai}:${POSTGRES_PASSWORD:-ring_ai}@postgres:5432/${POSTGRES_DB:-ring_ai}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Frontend ---
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://agentshakti.xyz}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.ringai-fe.rule=Host(`agentshakti.xyz`)"
      - "traefik.http.routers.ringai-fe.entrypoints=websecure"
      - "traefik.http.routers.ringai-fe.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ringai-fe.priority=1"
      - "traefik.http.services.ringai-fe.loadbalancer.server.port=3000"

volumes:
  pgdata:
  uploads:

networks:
  traefik-proxy:
    external: true
    name: traefik-proxy
